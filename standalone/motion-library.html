\u6FC0\u5149\u5207\u65AD",en:"Laser Cut"},description:{zh:"\u7EA2\u8272\u6FC0\u5149\u5212\u8FC7\u6587\u5B57\uFF0C\u4E0A\u4E0B\u4E24\u534A\u968F\u4E4B\u9519\u5F00\u3002",en:"A red laser slices the text and the halves slip apart."},sample:{zh:"\u5207\u65AD",en:"CUT"},component:"text",trigger:"auto",contexts:["tech","impact"],tech:"CSS",tags:["\u6FC0\u5149","\u5207\u65AD","Laser","Slice"],previewComponent:"LaserCut",aiPrompt:{zh:"\u7528 React \u548C CSS \u5236\u4F5C\u767D\u5E95\u9ED1\u5B57\u7684\u6FC0\u5149\u5207\u65AD\u6548\u679C\uFF1A\u53E0\u653E\u4E24\u4EFD\u6587\u5B57\uFF0C\u7528 clip-path \u5206\u522B\u663E\u793A\u4E0A\u534A\u548C\u4E0B\u534A\uFF1B\u7EA2\u8272 2px \u6FC0\u5149\u4ECE\u5DE6\u5230\u53F3\u626B\u8FC7\uFF0C\u626B\u8FC7\u540E\u4E0B\u534A\u90E8\u5411\u4E0B\u9519\u5F00 4px\u3001\u7565\u5FAE\u53F3\u79FB\uFF0C\u505C\u987F\u540E\u590D\u539F\u5E76\u5FAA\u73AF\u3002\u821E\u53F0\u8BBE\u7F6E container-type: inline-size\uFF0C\u5B57\u53F7\u968F\u821E\u53F0\u5BBD\u5EA6\u7F29\u653E\uFF0C\u5E76\u63D0\u4F9B\u51CF\u5C11\u52A8\u6001\u7684\u9759\u6001\u7248\u672C\u3002",en:"Create a laser-cut effect with React and CSS, black text on white: stack two copies of the text and use clip-path to show the top and bottom halves; a 2px red laser sweeps left to right, then the bottom half slips down 4px and slightly right, holds, resets and loops. Use container-type: inline-size so the font scales with the stage, and provide a static reduced-motion version."}},{id:"coin",name:{zh:"\u786C\u5E01\u7FFB\u8F6C",en:"Coin Flip"},description:{zh:"\u6BCF\u4E2A\u5B57\u4F9D\u6B21\u6CBF Y \u8F74\u7FFB\u8F6C\uFF0C\u50CF\u629B\u786C\u5E01\u4E00\u6837\u3002",en:"Each character flips on the Y axis like a tossed coin."},sample:{zh:"\u6B63\u9762\u53CD\u9762",en:"FLIP"},component:"text",trigger:"auto",contexts:["game"],tech:"CSS",tags:["\u7FFB\u724C","\u786C\u5E01","Flip","Coin"],previewComponent:"CoinFlip",aiPrompt:{zh:"\u7528 React \u628A\u6587\u5B57\u62C6\u6210\u5355\u4E2A\u5B57\u7B26\uFF0C\u4EE5 C 48C\u952E\u76D8\u70B9\u51FB\u91CD\u64AD\uFF1B\u81EA\u5B9A\u4E49\u6587\u5B57\u663E\u793A\u5728\u5361\u7247\u5185\uFF0C\u5E76\u63D0\u4F9B\u51CF\u5C11\u52A8\u6001\u7684\u9759\u6001\u7248\u672C\u3002",en:"Create a card entrance preview with React and CSS: a rounded card rises 20px into place while fading from 0 to 1 over 500ms with ease-out. Wrap the stage in a button so mouse and keyboard can replay it, show custom text inside the card, and provide a static reduced-motion version."}},{id:"scroll",name:{zh:"\u6EDA\u52A8\u663E\u73B0",en:"Scroll Reveal"},description:{zh:"\u6EDA\u52A8\u5230\u821E\u53F0\u65F6\uFF0C\u5185\u5BB9\u4ECE\u4E0B\u65B9\u6DE1\u5165\u3002",en:"Content fades up as the stage scrolls into view."},sample:{zh:"\u6EDA\u52A8\u663E\u73B0",en:"Scroll to reveal"},component:"card",trigger:"scroll",contexts:["showcase"],tech:"CSS",tags:["\u6EDA\u52A8","Scroll","Reveal"],previewComponent:"ScrollReveal",aiPrompt:{zh:"\u5728 React \u7EC4\u4EF6\u4E2D\u7528 IntersectionObserver \u76D1\u6D4B\u821E\u53F0\uFF0C\u8FDB\u5165\u53EF\u89C6\u8303\u56F4\u65F6\u663E\u793A\u5185\u5BB9\uFF0C\u79BB\u5F00\u65F6\u91CD\u7F6E\u3002\u7528 CSS transition \u8BA9\u5185\u5BB9\u4ECE translateY(24px)\u3001opacity: 0 \u8FC7\u6E21\u5230\u539F\u4F4D\uFF0C\u65F6\u957F 600ms\u3002\u5728 effect \u6E05\u7406\u65F6\u65AD\u5F00 observer\uFF0C\u5E76\u5C0A\u91CD prefers-reduced-motion\u3002",en:"In a React component, watch the stage with IntersectionObserver: reveal the content when it enters the viewport and reset when it leaves. Use a CSS transition from translateY(24px) and opacity: 0 to rest over 600ms. Disconnect the observer in the effect cleanup and respect prefers-reduced-motion."}},{id:"drag",name:{zh:"\u62D6\u62FD\u8DDF\u968F",en:"Drag Follow"},description:{zh:"\u6309\u4F4F\u5706\u5F62\u6807\u7B7E\uFF0C\u5728\u821E\u53F0\u5185\u62D6\u62FD\u3002",en:"Grab the pill and drag it around the stage."},sample:{zh:"\u62D6\u52A8\u6211",en:"Drag me"},component:"cursor",trigger:"drag",contexts:["interact   const stage = useRef<HTMLDivElement>(null);
  const timeline = useRef<ReturnType<typeof gsap.timeline>>(null);
  useEffect(() => {
    const media = gsap.matchMedia();
    media.add("(prefers-reduced-motion: no-preference)", () => {
      const word = stage.current!.querySelector("strong");
      const flash = stage.current!.querySelector("[data-flash]");
      timeline.current = gsap.timeline({ repeat: -1, repeatDelay: 1.5 })

    });

  }, []);

    <strong className="relative font-black text-fg" style={{ fontSize: "17cqw", textShadow: "0 0 24px rgb(129 140 248 / 0.8)" }}>{text}</strong>
  </div>;
}
